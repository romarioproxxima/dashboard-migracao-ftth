      background:rgba(0,0,0,0.4); color:rgba(255,255,255,0.7);

      align-items:center; gap:8px;
    }
    .auth-user.visible { display:flex; }
    .auth-user button {
      background:rgba(255,255,255,0.15); border:none; color:#fff;
      padding:3px 8px; border-radius:6px; cursor:pointer; font-size:10px;

  <script>
    const ZOHO_CLIENT_ID = "1000.RHMWPU5GSWDSKRT37ZGDTRNLC4QCNI";
    const REDIRECT_URI = "https://romarioproxxima.github.io/dashboard-migracao-ftth/";
    const AUTH_KEY = "proxxima_dash_token";
    const USER_KEY = "proxxima_dash_user";

    function zohoLogin() {
      const state = Math.random().toString(36).substring(2);
      sessionStorage.setItem("oauth_state", state);
      const url = "https://accounts.zoho.com/oauth/v2/auth?" + new URLSearchParams({
        client_id: ZOHO_CLIENT_ID,
        response_type: "token",
        redirect_uri: REDIRECT_URI,
        scope: "ZohoCliq.profile.READ",
        state: state,
        access_type: "online",
        prompt: "consent"
      });
      window.location.href = url;
    }

    async function verifyToken(token) {
      try {
        const res = await fetch("https://cliq.zoho.com/api/v2/getprofile", {
          headers: { "Authorization": "Zoho-oauthtoken " + token }
        });
        if (!res.ok) throw new Error("Token inválido");
        const data = await res.json();
        const email = (data.email_id || data.email || "").toLowerCase();
        if (!email.includes("proxxima")) throw new Error("Acesso restrito a colaboradores Proxxima");
        return { name: data.display_name || data.name || email, email };
      } catch(e) {
        throw e;
      }
    }

    function showDashboard(user) {
      document.getElementById("auth-overlay").classList.add("hidden");
      const badge = document.getElementById("user-badge");
      document.getElementById("user-name").textContent = "👤 " + (user.name || user.email);
      badge.classList.add("visible");
    }

    function logout() {
      localStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(USER_KEY);
      document.getElementById("auth-overlay").classList.remove("hidden");
      document.getElementById("user-badge").classList.remove("visible");
    }

    function showError(msg) {
      const el = document.getElementById("auth-error");
      el.textContent = msg;
      el.style.display = "block";
    }

    async function initAuth() {
      // 1. Check URL hash for token (coming back from Zoho)
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get("access_token");

      if (accessToken) {
        // Clear hash from URL
        history.replaceState(null, "", window.location.pathname + window.location.search);
        try {
          const user = await verifyToken(accessToken);
          localStorage.setItem(AUTH_KEY, accessToken);
          localStorage.setItem(USER_KEY, JSON.stringify(user));
          showDashboard(user);
        } catch(e) {
          showError(e.message);
        }
        return;
      }

      // 2. Check saved token
      const savedToken = localStorage.getItem(AUTH_KEY);
      const savedUser = localStorage.getItem(USER_KEY);
      if (savedToken && savedUser) {
        try {
          const user = await verifyToken(savedToken);
          showDashboard(user);
        } catch(e) {
          localStorage.removeItem(AUTH_KEY);
          localStorage.removeItem(USER_KEY);
        }
      }
    }

    // Run auth check on page load
    initAuth();
  </script>

                      <div style={{position:"absolute",left:`${pct(HOJE_G)}%`,top:-4,width:2,height:rowH+8,background:"#e2445c",zIndex:7}}>
                        <div style={{position:"absolute",top:-12,left:-10,fontSize:9,color:"#e2445c",fontWeight:800,background:"#fff",padding:"1px 4px",borderRadius:3,border:"1px solid #e2445c",whiteSpace:"nowrap"}}>hoje</div>
                      </div>

                    {fasesCfg.map((fc,fi)=>{

                      const tot = fc.getTot(s);
                      if (tot === 0) return null;
                      // Posição real: início da fase ou início da semana, o que vier depois
                      const barIni = new Date(Math.max(fc.inicio.getTime(), sem.ini.getTime()));
                      const barFim = new Date(Math.min(fc.fim.getTime(), sem.fim.getTime() + 86400000));
                      const left   = pct(barIni);
                      const wid    = pctW(barIni, barFim);
                      const isFirst = si === 0 || !semanas3[si-1].fases[fc.key];
                      const isLast  = si === semanas3.length-1 || !semanas3[si+1].fases[fc.key];
                      const topIdx  = fasesCfg.filter((f,i)=>i<=fi&&sem.fases[f.key]).length - 1;
                      return (
                        <div key={fi} style={{position:"absolute",left:`${left}%`,width:`${wid}%`,top:topIdx*22+4,height:18,background:fc.color,borderRadius:5,display:"flex",alignItems:"center",paddingLeft:6,paddingRight:4,zIndex:3,opacity:0.9,boxShadow:`0 1px 4px ${fc.color}44`,overflow:"hidden"}}>
                          <span style={{fontSize:10,fontWeight:700,color:"#fff",whiteSpace:"nowrap",flex:1}}>
                            {isFirst && <span style={{marginRight:4,fontSize:9,opacity:0.85}}>▶</span>}
                            {fc.fmt(tot)}
                            {isLast && <span style={{marginLeft:4,fontSize:9,opacity:0.85}}>■</span>}
                          </span>
                          {(isFirst || isLast) && (
                            <span style={{fontSize:9,color:"rgba(255,255,255,0.85)",whiteSpace:"nowrap",flexShrink:0}}>
                              {isFirst ? fmtD(fc.inicio) : fmtD(fc.fim)}

                        </div>
                      );
                    })}
                  </div>
                </div>
              );

            {/* Legenda */}
            <div style={{display:"flex",gap:16,marginLeft:126,marginTop:10,fontSize:10,color:"#888",flexWrap:"wrap",alignItems:"center"}}>

              <span style={{color:"#aaa"}}>▶ início da fase &nbsp; ■ fim da fase</span>
            </div>
          </div>
        </div>
      );
    }

    // ─── GANTT POR SEMANA ─────────────────────────────────────────────────────────
    function GanttChart({ semanas, inicio, fim, corBarra, feriados, tipo }) {
      const totalDias = Math.ceil((fim - inicio) / (1000*60*60*24)) + 1;
      const allDays = [];
      const cur = new Date(inicio);
      while (cur <= fim) { allDays.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }

      const meses = [];
      allDays.forEach((d, i) => {
        const m = d.getMonth();
        if (!meses.length || meses[meses.length-1].mes !== m) meses.push({ mes:m, label:d.toLocaleDateString("pt-BR",{month:"short"}), count:1 });
        else meses[meses.length-1].count++;
      });

      const pct = d => (Math.ceil((d - inicio) / (1000*60*60*24)) / totalDias) * 100;
      const W = 100 / totalDias;
      const HOJE = new Date("2026-05-13");
      const hojeVisible = HOJE >= inicio && HOJE <= fim;
      const hojeLeft = hojeVisible ? pct(HOJE) : null;

      return (
        <div style={{ background:"#fff", borderRadius:14, padding:20, boxShadow:"0 2px 12px rgba(0,0,0,0.07)", marginBottom:16, overflowX:"auto" }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:14, color:"#1f1f1f" }}>📊 Gráfico de Gantt</div>
          <div style={{ minWidth:560 }}>
            <div style={{ display:"flex", marginBottom:4, marginLeft:124 }}>
              {meses.map((m, i) => (
                <div key={i} style={{ width:`${(m.count/totalDias)*100}%`, fontSize:10, fontWeight:700, color:"#0073ea", textAlign:"center", borderLeft:"1px solid #e8e8e8", paddingLeft:3 }}>
                  {m.label.toUpperCase()}
                </div>
              ))}
            </div>

            {semanas.map((s, si) => {
              const dIni = s.dias[0].dia;
              const dFim = s.dias[s.dias.length-1].dia;
              const left = pct(dIni);
              const width = ((Math.ceil((dFim - dIni) / (1000*60*60*24)) + 1) / totalDias) * 100;
              const totalSem = tipo === "vistoria"
                ? s.dias.reduce((a, d) => a + d.projsDia.length, 0)
                : s.dias.reduce((a, d) => a + d.total, 0);
              const temFeriado = feriados.some(f => { const fd = new Date(f); return fd >= dIni && fd <= dFim; });

              return (
                <div key={si} style={{ display:"flex", alignItems:"center", marginBottom:6 }}>
                  <div style={{ width:124, flexShrink:0, fontSize:11, color:"#555", fontWeight:600, paddingRight:8, textAlign:"right" }}>
                    Sem. {si+1}
                    <div style={{ fontSize:9, color:"#bbb", fontWeight:400 }}>{fmtShort(dIni)}–{fmtShort(dFim)}</div>
                  </div>
                  <div style={{ flex:1, position:"relative", height:28, background:"#f5f6f8", borderRadius:6, overflow:"hidden" }}>
                    {feriados.map(f => {
                      const fd = new Date(f);
                      if (fd < inicio || fd > fim) return null;
                      return (
                        <div key={f} style={{ position:"absolute", left:`${pct(fd)}%`, top:0, width:`${W*1.5}%`, height:"100%", background:"#ffe0e0", zIndex:1 }} />
                      );
                    })}
                    <div style={{ position:"absolute", left:`${left}%`, width:`${width}%`, height:"100%", background:corBarra, borderRadius:6, display:"flex", alignItems:"center", paddingLeft:8, zIndex:2, opacity:0.88 }}>
                      <span style={{ fontSize:10, fontWeight:700, color:"#fff", whiteSpace:"nowrap" }}>
                        {tipo === "vistoria" ? `${totalSem} vistorias` : `${totalSem} clusters`}{temFeriado ? " 🚫" : ""}
                      </span>
                    </div>
                  </div>
                </div>
              );
            })}

            <div style={{ display:"flex", marginTop:4 }}>
              <div style={{ width:124, flexShrink:0 }} />
              <div style={{ flex:1, position:"relative", height:18 }}>
                {allDays.filter(d => d.getDay() === 1).map((d, i) => (
                  <div key={i} style={{ position:"absolute", left:`${pct(d)}%`, top:0, width:1, height:"100%", background:"#e8e8e8" }} />
                ))}
                {hojeVisible && (
                  <div style={{ position:"absolute", left:`${hojeLeft}%`, top:0, width:2, height:"100%", background:"#e2445c", zIndex:3 }}>
                    <div style={{ position:"absolute", top:-13, left:-14, fontSize:9, color:"#e2445c", fontWeight:700, whiteSpace:"nowrap", background:"#fff", padding:"1px 3px", borderRadius:3 }}>hoje</div>
                  </div>
                )}
              </div>
            </div>

            <div style={{ display:"flex", gap:16, marginTop:10, marginLeft:124, fontSize:10, color:"#888", flexWrap:"wrap" }}>
              <span><span style={{ display:"inline-block", width:12, height:10, background:corBarra, borderRadius:2, marginRight:4, opacity:0.88 }} />Semana ativa</span>
              <span><span style={{ display:"inline-block", width:12, height:10, background:"#ffe0e0", border:"1px solid #ffb3b3", borderRadius:2, marginRight:4 }} />Feriado</span>
              <span><span style={{ display:"inline-block", width:2, height:10, background:"#e2445c", marginRight:4 }} />Hoje (10/04)</span>
            </div>
          </div>
        </div>
      );
    }

    // ─── APP ─────────────────────────────────────────────────────────────────────

    // ─── BOARD MONDAY COMPONENT ──────────────────────────────────────────────────
    function BoardMonday({ fmt, fmtN, statusColorMap }) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [msg, setMsg] = useState("");
      const [search, setSearch] = useState("");
      const [statusF, setStatusF] = useState("all");
      const [sortCfg, setSortCfg] = useState({col:"nome",dir:"asc"});

      const STATUS_MAP_B = {
        "Em desenvolvimento":"Em desenvolvimento","Aguardando vistoria":"Aguardando vistoria",
        "Vistoria Concluída":"Vistoria concluída","Avaliação do supervisor":"Avaliação supervisor",
        "Avaliação coordenador":"Avaliação coordenador","Avaliação gerencia":"Avaliação gerência",
        "Aguardando Aprovação diretoria":"Aguard. aprovação diretoria","Em correção":"Em correção",
        "Projetado":"Projetado","Pausado":"Pausado","Em Ajuste":"Em Ajuste",
        "Em Revisão":"Em Revisão","Reprovado":"Reprovado",
      };

      const load = async () => {
        setLoading(true); setMsg("");
        try {
          const cols = ["color_mm0as2nc","person","numeric_mm0fhmyb","numeric_mm0a5pkz",
            "numeric_mm0awjmt","numeric_mm0fach","numeric_mm0fpr61","numeric_mm0fzxsd",
            "numeric_mm3bhenr","numeric_mm0fhb2h"];
          const q = "query { boards(ids:[18399019664]){ items_page(limit:100){ items{ id name url column_values(ids:" + JSON.stringify(cols) + "){ id text } } } } }";
          const res = await fetch("https://api.monday.com/v2",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":"eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY0MjY2NzIwMiwiYWFpIjoxMSwidWlkIjozMTAwMDkyMSwiaWFkIjoiMjAyNi0wNC0wN1QxODoyNDozNC4wMDBaIiwicGVyIjoibWU6d3JpdGUiLCJhY3RpZCI6NzgwNjUxNywicmduIjoidXNlMSJ9.l0EKBBwMgKiUXQy0SiQ5v8wic9kD9Tqk80keoxdDB-s","API-Version":"2024-01"},
            body:JSON.stringify({query:q})
          });
          const js = await res.json();
          if(!js.data) throw new Error(js.errors?.[0]?.message||"Erro API");
          const items = js.data.boards[0].items_page.items.map(item => {
            const v={};
            item.column_values.forEach(cv=>{v[cv.id]=cv.text;});
            const valor     = parseFloat(v["numeric_mm0fhmyb"])||0;
            const cabos     = parseFloat(v["numeric_mm0a5pkz"])||0;
            const cto8      = parseFloat(v["numeric_mm0awjmt"])||0;
            const cto16     = parseFloat(v["numeric_mm0fach"])||0;
            const clientes  = parseFloat(v["numeric_mm0fpr61"])||0;
            const atendidos = parseFloat(v["numeric_mm0fhb2h"])||0;
            const postes    = parseFloat(v["numeric_mm0fzxsd"])||0;
            const ajustado  = parseFloat(v["numeric_mm3bhenr"])||0;
            const totalCto  = cto8 + cto16;
            const portas    = cto8*8 + cto16*16;
            return {
              id:item.id, nome:item.name, url:item.url,
              projetista: v["person"]||"—",
              status: STATUS_MAP_B[v["color_mm0as2nc"]||""] || v["color_mm0as2nc"] || "",
              valor, cabos, cto8, cto16, totalCto, portas,
              clientes, atendidos, postes, ajustado,
              valorPorPorta:    portas>0 ? valor/portas : 0,
              valorPorCliente:  clientes>0 ? valor/clientes : 0,
              portaAjustada:    portas>0 ? ajustado/portas : 0,
            };
          });
          setData(items);
          setMsg(`✅ ${items.length} projetos · ${new Date().toLocaleString("pt-BR")}`);
        } catch(e) {
          setMsg("❌ "+e.message);
        }
        setLoading(false);
      };

      const allStatuses = data ? [...new Set(data.map(p=>p.status))].filter(Boolean).sort() : [];
      const filtered = (data||[])
        .filter(p=>statusF==="all"||p.status===statusF)
        .filter(p=>!search||p.nome.toLowerCase().includes(search.toLowerCase())||p.projetista.toLowerCase().includes(search.toLowerCase()));
      const sorted = [...filtered].sort((a,b)=>{
        const va=typeof a[sortCfg.col]==="string"?a[sortCfg.col].toLowerCase():a[sortCfg.col]||0;
        const vb=typeof b[sortCfg.col]==="string"?b[sortCfg.col].toLowerCase():b[sortCfg.col]||0;
        return sortCfg.dir==="asc"?(va>vb?1:va<vb?-1:0):(va<vb?1:va>vb?-1:0);
      });

      const sort = col => setSortCfg(s=>({col,dir:s.col===col&&s.dir==="asc"?"desc":"asc"}));
      const ico = col => sortCfg.col===col?(sortCfg.dir==="asc"?" ▲":" ▼"):" ⇅";
      // th() called as function (not component) to avoid infinite re-render

          background:"#f8f9fb",fontSize:11}}>
          {label}{ico(col)}

      const totals = sorted.reduce((acc,p)=>{
        acc.valor+=p.valor; acc.ajustado+=p.ajustado; acc.portas+=p.portas;

      return (
        <div style={{padding:20}}>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:20,fontWeight:800,color:"#1f1f1f"}}>📊 Board Monday — Visão Completa</div>
            <div style={{fontSize:11,color:"#888",marginTop:3}}>Dados ao vivo direto do Monday.com · Todos os campos financeiros e operacionais</div>
          </div>

          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
            <button onClick={load} disabled={loading}
              style={{display:"flex",alignItems:"center",gap:8,padding:"10px 22px",borderRadius:10,
                border:"none",background:loading?"#aaa":"#0073ea",color:"#fff",fontWeight:700,fontSize:13,

              {loading ? <><span style={{display:"inline-block",width:14,height:14,border:"2px solid #fff",
                  borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/> Carregando...</>

            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>

            </div>

                <GanttUnificado />
                {/* Seletor de seção para detalhes */}
                <div style={{ display:"flex", gap:8, marginBottom:16, flexWrap:"wrap" }}>
                  {[["projetos","🏗️ Elaboração",`${totalAProjetar} clusters`,"#0073ea"],["vistoria","🔍 Vistoria",`${TOTAL_VISTORIA} vistorias`,"#00c875"],["avaliacao","📋 Avaliação",`${AVAL_DIAS} dias/proj`,"#fdab3d"]].map(([sec,lbl,qtd,cor]) => (
                    <button key={sec} onClick={() => setCronSec(sec)} style={{ padding:"8px 18px", borderRadius:10, border:`2px solid ${cronSec===sec?cor:"#e0e0e0"}`, cursor:"pointer", fontWeight:700, fontSize:12, background:cronSec===sec?cor:"#fff", color:cronSec===sec?"#fff":"#555", display:"flex", alignItems:"center", gap:8 }}>
                      {lbl}
                      <span style={{ background:cronSec===sec?"rgba(255,255,255,0.25)":"#f0f0f0", color:cronSec===sec?"#fff":"#888", borderRadius:20, padding:"1px 8px", fontSize:10, fontWeight:700 }}>{qtd}</span>
                    </button>
                  ))}
                </div>

                {/* ── SEÇÃO ELABORAÇÃO ── */}
                {cronSec === "projetos" && <div>
                <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:16 }}>
                  {[
                    { label:"A projetar", value:String(totalAProjetar), sub:`${totalPendente} pend. + ${totalEmDesenv} desenv.`, color:"#e2445c", icon:"⏳" },
                    { label:"Projetistas", value:String(PROJETISTAS.length), sub:`${CLUSTERS_POR_PROJETISTA_DIA} clusters/dia cada`, color:"#0073ea", icon:"👷" },
                    { label:"Cap./dia", value:String(CAPACIDADE_DIA), sub:"clusters", color:"#a25ddc", icon:"⚡" },
                    { label:"Dias úteis", value:String(nDiasProj), sub:"desc. feriados", color:"#fdab3d", icon:"📆" },
                    { label:"Início", value:"13/04", sub:"2026", color:"#579bfc", icon:"🚀" },
                    { label:"Término", value:fmtShort(fimProj), sub:"2026", color:"#00c875", icon:"🏁" },
                  ].map(c => (
                    <div key={c.label} style={{ background:"#fff", borderRadius:14, padding:"14px 16px", boxShadow:"0 2px 10px rgba(0,0,0,0.07)", borderLeft:`4px solid ${c.color}`, flex:1, minWidth:90 }}>
                      <div style={{ fontSize:10, color:"#999", marginBottom:2 }}>{c.icon} {c.label}</div>
                      <div style={{ fontSize:20, fontWeight:800, color:c.color }}>{c.value}</div>
                      <div style={{ fontSize:10, color:"#bbb" }}>{c.sub}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:8, marginBottom:16 }}>
                  {[["gantt","📊 Gantt"],["resumo","Resumo"],["semanal","Por Semana"],["diario","Dia a Dia"]].map(([t,l]) => tabBtn(t, cronTab, setCronTab, l))}
                </div>

                {cronTab === "gantt" && (
                  <GanttChart semanas={semanasProj} inicio={CRON_START} fim={fimProj} corBarra="#0073ea" feriados={FERIADOS} tipo="projetos" />
                )}

                {cronTab === "resumo" && (
                  <div>
                    <div style={{ background:"#fff", borderRadius:14, padding:20, marginBottom:14, boxShadow:"0 2px 10px rgba(0,0,0,0.06)" }}>
                      <div style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>Conclusão por Semana</div>
                      {semanasProj.map((s, i) => {
                        const ts = s.dias.reduce((a,d) => a+d.total, 0);
                        const ai = i===0 ? 0 : semanasProj.slice(0,i).reduce((a,w) => a+w.dias.reduce((b,d) => b+d.total,0), 0);
                        return (
                          <div key={i} style={{ marginBottom:12 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:4 }}>
                              <span style={{ fontWeight:600 }}>Semana {i+1} <span style={{ fontWeight:400, color:"#aaa" }}>({fmtShort(s.dias[0].dia)}–{fmtShort(s.dias[s.dias.length-1].dia)})</span></span>
                              <span style={{ color:"#888" }}>{ts} clusters → <b>{ai+ts}/{totalAProjetar}</b></span>
                            </div>
                            <PBar value={ai+ts} max={totalAProjetar} color={PCOLORS[i%PCOLORS.length]} h={10} />
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ background:"#fff", borderRadius:14, padding:20, boxShadow:"0 2px 10px rgba(0,0,0,0.06)" }}>
                      <div style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>Carga por Projetista</div>
                      {PROJETISTAS.map((p, i) => {
                        const total = allDiasProj.reduce((s,d) => { const c = d.clustersHoje.find(c => c.projetista===p); return s+(c?c.qtd:0); }, 0);
                        return (
                          <div key={p} style={{ marginBottom:14 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:4 }}>
                              <span style={{ fontWeight:700, color:PCOLORS[i] }}>👷 {p}</span>
                              <span style={{ color:"#888" }}>{total} clusters · {Math.ceil(total/2)} dias</span>
                            </div>
                            <PBar value={total} max={totalAProjetar} color={PCOLORS[i]} h={10} />
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {cronTab === "semanal" && (
                  <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                    {semanasProj.map((s, i) => {
                      const ts = s.dias.reduce((a,d) => a+d.total, 0);
                      const ai = i===0 ? 0 : semanasProj.slice(0,i).reduce((a,w) => a+w.dias.reduce((b,d) => b+d.total,0), 0);
                      const open = semSel === i;
                      return (
                        <div key={i} style={{ background:"#fff", borderRadius:14, overflow:"hidden", boxShadow:"0 2px 10px rgba(0,0,0,0.06)" }}>
                          <div onClick={() => setSemSel(open?-1:i)} style={{ padding:"13px 18px", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", background:open?"#f0f7ff":"#fff" }}>
                            <div><span style={{ fontWeight:700, fontSize:13 }}>Semana {i+1}</span><span style={{ fontSize:11, color:"#aaa", marginLeft:8 }}>{fmtFull(s.dias[0].dia)} → {fmtFull(s.dias[s.dias.length-1].dia)}</span></div>
                            <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                              <span style={{ fontSize:12, color:"#0073ea", fontWeight:700 }}>{ts} clusters</span>
                              <span style={{ fontSize:11, color:"#aaa" }}>acum. {ai+ts}/{totalAProjetar}</span>
                              <span style={{ color:"#aaa" }}>{open?"▲":"▼"}</span>
                            </div>
                          </div>
                          {open && (
                            <div style={{ padding:"0 18px 14px", overflowX:"auto" }}>
                              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                                <thead>
                                  <tr style={{ background:"#f8f9fb" }}>
                                    <th style={{ padding:"8px 10px", textAlign:"left", color:"#555", fontWeight:600, borderBottom:"1px solid #eee" }}>Dia</th>
                                    {PROJETISTAS.map((p, pi) => <th key={p} style={{ padding:"8px 10px", color:PCOLORS[pi], fontWeight:700, borderBottom:"1px solid #eee" }}>{p}</th>)}
                                    <th style={{ padding:"8px 10px", textAlign:"center", color:"#555", fontWeight:600, borderBottom:"1px solid #eee" }}>Total</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {s.dias.map((d, j) => (
                                    <tr key={j} style={{ background:j%2===0?"#fff":"#fafafa" }}>
                                      <td style={{ padding:"8px 10px", borderBottom:"1px solid #f0f0f0", fontWeight:600, whiteSpace:"nowrap" }}>{fmtFull(d.dia)}</td>
                                      {PROJETISTAS.map((p, pi) => {
                                        const c = d.clustersHoje.find(c => c.projetista===p);
                                        return <td key={p} style={{ padding:"8px 10px", borderBottom:"1px solid #f0f0f0", color:c?PCOLORS[pi]:"#ddd", fontWeight:c?600:400 }}>{c?`#${c.de}–${c.ate}`:"—"}</td>;
                                      })}
                                      <td style={{ padding:"8px 10px", borderBottom:"1px solid #f0f0f0", textAlign:"center", fontWeight:800, color:"#0073ea" }}>{d.total}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

                {cronTab === "diario" && (
                  <div style={{ background:"#fff", borderRadius:14, boxShadow:"0 2px 10px rgba(0,0,0,0.06)", overflowX:"auto" }}>
                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                      <thead>
                        <tr style={{ background:"#f8f9fb" }}>
                          <th style={{ padding:"11px 14px", textAlign:"left", color:"#555", fontWeight:700, borderBottom:"2px solid #eee" }}>Dia</th>
                          {PROJETISTAS.map((p,i) => <th key={p} style={{ padding:"11px 14px", color:PCOLORS[i], fontWeight:700, borderBottom:"2px solid #eee" }}>{p}</th>)}
                          <th style={{ padding:"11px 14px", textAlign:"center", color:"#555", fontWeight:700, borderBottom:"2px solid #eee" }}>Dia</th>
                          <th style={{ padding:"11px 14px", textAlign:"center", color:"#555", fontWeight:700, borderBottom:"2px solid #eee" }}>Acum.</th>
                        </tr>
                      </thead>
                      <tbody>
                        {allDiasProj.map((d, i) => (
                          <tr key={i} style={{ background:i%2===0?"#fff":"#fafafa" }}>
                            <td style={{ padding:"9px 14px", borderBottom:"1px solid #f0f0f0", fontWeight:600, whiteSpace:"nowrap" }}>{fmtFull(d.dia)}</td>
                            {PROJETISTAS.map((p, pi) => {
                              const c = d.clustersHoje.find(c => c.projetista===p);
                              return <td key={p} style={{ padding:"9px 14px", borderBottom:"1px solid #f0f0f0", color:c?PCOLORS[pi]:"#ddd", whiteSpace:"nowrap", fontWeight:c?600:400 }}>{c?`#${c.de}–${c.ate}`:"—"}</td>;
                            })}
                            <td style={{ padding:"9px 14px", borderBottom:"1px solid #f0f0f0", textAlign:"center", fontWeight:800, color:"#0073ea" }}>{d.total}</td>
                            <td style={{ padding:"9px 14px", borderBottom:"1px solid #f0f0f0", textAlign:"center" }}>
                              <span style={{ background:acumProj[i]>=totalAProjetar?"#00c875":"#f0f0f0", color:acumProj[i]>=totalAProjetar?"#fff":"#555", borderRadius:20, padding:"2px 10px", fontWeight:700, fontSize:11 }}>{acumProj[i]}/{totalAProjetar}</span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
                </div>}

                {/* ── SEÇÃO VISTORIA ── */}
                {cronSec === "vistoria" && <div>
                <div style={{ marginBottom:16 }}>
                  <div style={{ fontSize:16, fontWeight:800, color:"#1f1f1f" }}>🔍 Cronograma de Vistorias</div>
                  <div style={{ fontSize:12, color:"#888", marginTop:2 }}>Início após elaboração · {TOTAL_VISTORIA} projetos · 6/dia · {fmtShort(VIST_START)} → {fmtShort(fimVist)}</div>
                </div>
                <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:16 }}>
                  {[
                    { label:"Total a vistoriar", value:String(TOTAL_VISTORIA), sub:`${jaAguardando.length} pipeline + ${totalAProjetar} a projetar`, color:"#e2445c", icon:"🔍" },
                    { label:"Vistorias/dia", value:"6", sub:"média diária", color:"#0073ea", icon:"📋" },
                    { label:"Dias úteis", value:String(nDiasVist), sub:"desc. feriados", color:"#fdab3d", icon:"📆" },
                    { label:"Início", value:"08/04", sub:"2026", color:"#579bfc", icon:"🚀" },
                    { label:"Término", value:fmtShort(fimVist), sub:"2026", color:"#00c875", icon:"🏁" },
                  ].map(c => (
                    <div key={c.label} style={{ background:"#fff", borderRadius:14, padding:"14px 16px", boxShadow:"0 2px 10px rgba(0,0,0,0.07)", borderLeft:`4px solid ${c.color}`, flex:1, minWidth:100 }}>
                      <div style={{ fontSize:10, color:"#999", marginBottom:2 }}>{c.icon} {c.label}</div>
                      <div style={{ fontSize:20, fontWeight:800, color:c.color }}>{c.value}</div>
                      <div style={{ fontSize:10, color:"#bbb" }}>{c.sub}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:8, marginBottom:16 }}>
                  {[["gantt","📊 Gantt"],["resumo","Por Semana"],["diario","Dia a Dia"]].map(([t,l]) => tabBtn(t, vistTab, setVistTab, l))}
                </div>

                {vistTab === "gantt" && (
                  <GanttChart semanas={semanasVist} inicio={VIST_START} fim={fimVist} corBarra="#579bfc" feriados={FERIADOS_VIST} tipo="vistoria" />
                )}

                {vistTab === "resumo" && (
                  <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                    {semanasVist.map((s, i) => {
                      const ts = s.dias.reduce((a,d) => a+d.projsDia.length, 0);
                      const ai = i===0 ? 0 : semanasVist.slice(0,i).reduce((a,w) => a+w.dias.reduce((b,d) => b+d.projsDia.length,0), 0);
                      const open = semVSel === i;
                      return (
                        <div key={i} style={{ background:"#fff", borderRadius:14, overflow:"hidden", boxShadow:"0 2px 10px rgba(0,0,0,0.06)" }}>
                          <div onClick={() => setSemVSel(open?-1:i)} style={{ padding:"13px 18px", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", background:open?"#f0f7ff":"#fff" }}>
                            <div><span style={{ fontWeight:700, fontSize:13 }}>Semana {i+1}</span><span style={{ fontSize:11, color:"#aaa", marginLeft:8 }}>{fmtFull(s.dias[0].dia)} → {fmtFull(s.dias[s.dias.length-1].dia)}</span></div>
                            <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                              <span style={{ fontSize:12, color:"#579bfc", fontWeight:700 }}>{ts} vistorias</span>
                              <span style={{ fontSize:11, color:"#aaa" }}>acum. {ai+ts}/{TOTAL_VISTORIA}</span>
                              <span style={{ color:"#aaa" }}>{open?"▲":"▼"}</span>
                            </div>
                          </div>
                          {open && (
                            <div style={{ padding:"0 18px 14px" }}>
                              {s.dias.map((d, j) => (
                                <div key={j} style={{ marginBottom:10 }}>
                                  <div style={{ fontWeight:600, fontSize:12, color:"#333", padding:"7px 0 5px", borderBottom:"1px solid #f0f0f0", marginBottom:6 }}>📅 {fmtFull(d.dia)}</div>
                                  {d.projsDia.map((p, k) => (
                                    <div key={k} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 10px", background:k%2===0?"#f9f9f9":"#fff", borderRadius:8, marginBottom:4 }}>
                                      <div style={{ flex:1 }}>
                                        <div style={{ fontSize:12, color:p.tipo==="novo"?"#bbb":"#333", fontWeight:p.tipo==="pipeline"?600:400 }}>{p.nome}</div>
                                        <div style={{ fontSize:10, color:"#bbb" }}>{p.cidade}</div>
                                      </div>
                                      {p.tipo === "pipeline" && <span style={{ background:"#579bfc", color:"#fff", borderRadius:20, padding:"3px 10px", fontSize:10, fontWeight:700 }}>pipeline</span>}
                                      {p.tipo === "novo" && <span style={{ background:"#e8e8e8", color:"#888", borderRadius:20, padding:"3px 10px", fontSize:10 }}>a projetar</span>}
                                    </div>
                                  ))}
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

                {vistTab === "diario" && (
                  <div style={{ background:"#fff", borderRadius:14, boxShadow:"0 2px 10px rgba(0,0,0,0.06)", overflowX:"auto" }}>
                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                      <thead>
                        <tr style={{ background:"#f8f9fb" }}>
                          <th style={{ padding:"11px 14px", textAlign:"left", color:"#555", fontWeight:700, borderBottom:"2px solid #eee", whiteSpace:"nowrap" }}>Dia</th>
                          <th style={{ padding:"11px 14px", textAlign:"left", color:"#555", fontWeight:700, borderBottom:"2px solid #eee" }}>Projetos</th>
                          <th style={{ padding:"11px 14px", textAlign:"center", color:"#555", fontWeight:700, borderBottom:"2px solid #eee" }}>Acum.</th>
                        </tr>
                      </thead>
                      <tbody>
                        {allDiasVist.map((d, i) => {
                          const acum = allDiasVist.slice(0, i+1).reduce((s, x) => s + x.projsDia.length, 0);
                          return (
                            <tr key={i} style={{ background:i%2===0?"#fff":"#fafafa" }}>
                              <td style={{ padding:"9px 14px", borderBottom:"1px solid #f0f0f0", fontWeight:600, whiteSpace:"nowrap", verticalAlign:"top" }}>{fmtFull(d.dia)}</td>
                              <td style={{ padding:"9px 14px", borderBottom:"1px solid #f0f0f0" }}>
                                {d.projsDia.map((p, k) => (
                                  <div key={k} style={{ marginBottom:k<d.projsDia.length-1?4:0, display:"flex", alignItems:"center", gap:6 }}>
                                    <span style={{ color:p.tipo==="novo"?"#bbb":"#333", fontWeight:p.tipo==="pipeline"?600:400 }}>{p.nome}</span>
                                    {p.tipo === "pipeline" && <span style={{ background:"#579bfc", color:"#fff", borderRadius:20, padding:"1px 8px", fontSize:10, fontWeight:700, flexShrink:0 }}>pipeline</span>}
                                    {p.tipo === "novo" && <span style={{ background:"#e8e8e8", color:"#888", borderRadius:20, padding:"1px 8px", fontSize:10, flexShrink:0 }}>a projetar</span>}
                                  </div>
                                ))}
                              </td>
                              <td style={{ padding:"9px 14px", borderBottom:"1px solid #f0f0f0", textAlign:"center", verticalAlign:"top" }}>
                                <span style={{ background:acum>=TOTAL_VISTORIA?"#00c875":"#f0f0f0", color:acum>=TOTAL_VISTORIA?"#fff":"#555", borderRadius:20, padding:"2px 10px", fontWeight:700, fontSize:11 }}>{acum}/{TOTAL_VISTORIA}</span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
                </div>}

                {/* ── SEÇÃO AVALIAÇÃO ── */}
                {cronSec === "avaliacao" && <div>
                <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:16 }}>
                  {[
                    { label:"Projetos a avaliar", value:String(TOTAL_VISTORIA), sub:"total após vistoria", color:"#fdab3d", icon:"📋" },
                    { label:"Dias por projeto", value:String(AVAL_DIAS), sub:"dias úteis de avaliação", color:"#e2445c", icon:"📅" },
                    { label:"Início", value:fmtShort(AVAL_START), sub:"3 dias após início vistoria", color:"#0073ea", icon:"🚀" },
                    { label:"Término", value:fmtShort(fimAval), sub:"2026", color:"#00c875", icon:"🏁" },
                  ].map(c => (
                    <div key={c.label} style={{ background:"#fff", borderRadius:14, padding:"14px 16px", boxShadow:"0 2px 10px rgba(0,0,0,0.07)", borderLeft:`4px solid ${c.color}`, flex:1, minWidth:120 }}>
                      <div style={{ fontSize:10, color:"#999", marginBottom:2 }}>{c.icon} {c.label}</div>
                      <div style={{ fontSize:20, fontWeight:800, color:c.color }}>{c.value}</div>
                      <div style={{ fontSize:10, color:"#bbb" }}>{c.sub}</div>
                    </div>
                  ))}
                </div>
                <div style={{ background:"#fff", borderRadius:14, padding:20, boxShadow:"0 2px 10px rgba(0,0,0,0.06)" }}>
                  <div style={{ fontWeight:700, fontSize:14, marginBottom:14, color:"#1f1f1f" }}>📋 Como funciona a Avaliação</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                    <div style={{ background:"#fff8ec", borderRadius:10, padding:"14px 16px", border:"1px solid #ffe08a" }}>
                      <div style={{ fontWeight:700, fontSize:13, color:"#b8860b", marginBottom:6 }}>⚙️ Lógica de sequência</div>
                      <div style={{ fontSize:12, color:"#555", lineHeight:1.7 }}>
                        Cada projeto passa por <b>3 dias úteis de avaliação</b> após sua vistoria ser concluída.<br/>
                        A fase de avaliação começa no 1º dia útil após o fim da vistoria ({fmtShort(AVAL_START)}) e termina em {fmtShort(fimAval)}.<br/>
                        Projetos vistoriados mais cedo entram em avaliação mais cedo (processo contínuo).
                      </div>
                    </div>
                    <div style={{ background:"#f0f7ff", borderRadius:10, padding:"14px 16px", border:"1px solid #c5dcff" }}>
                      <div style={{ fontWeight:700, fontSize:13, color:"#0073ea", marginBottom:10 }}>📅 Linha do tempo da Avaliação</div>
                      {diasAval.map((d, i) => (
                        <div key={i} style={{ display:"flex", alignItems:"center", gap:12, marginBottom:8, padding:"8px 12px", background:"#fff", borderRadius:8, border:"1px solid #e8f0fe" }}>
                          <div style={{ width:28, height:28, borderRadius:"50%", background:"#fdab3d", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontWeight:800, fontSize:12, flexShrink:0 }}>{i+1}</div>
                          <div>
                            <div style={{ fontSize:12, fontWeight:700, color:"#333" }}>Dia {i+1} — {d.toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"2-digit"})}</div>
                            <div style={{ fontSize:11, color:"#888" }}>Avaliação dos projetos vistoriados {AVAL_DIAS-(i)} dias antes</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                </div>}

              </div>
            )}

            {/* ══ BOARD MONDAY LIVE ══ */}
            {modulo === "boardlive" && (
              <BoardMonday fmt={fmt} fmtN={fmtN} statusColorMap={statusColorMap} />
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
